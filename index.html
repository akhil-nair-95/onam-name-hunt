<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ഓണം നെയിം ഹണ്ട്</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="lang-toggle" id="langToggle">
      <button type="button" data-lang="ml">മലയാളം</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <header class="site-header">
      <p class="kicker" id="txtKicker"></p>
      <h1 id="txtTitle"></h1>
      <p class="sub" id="txtSub"></p>
    </header>

    <div id="statusBanner"></div>
    <div id="countdownCard"></div>
    <div id="winnerCard"></div>
    <div id="alreadySubmittedCard"></div>

    <section class="card" id="formCard">
      <form class="submit-form" id="submitForm" autocomplete="off">
        <input type="text" id="submitterInput" maxlength="60" required>
        <input type="text" id="nameInput" maxlength="60" required>
        <button type="submit" class="btn" id="submitBtn"></button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </section>

    <section class="card" id="listCard">
      <h2 class="list-title" id="txtListTitle"></h2>
      <div id="namesList"></div>
    </section>

    <p class="footer-note" id="txtFooterNote"></p>
  </div>

  <script type="module">
    import {
      subscribeToNames, subscribeToStatus, submitOrVoteName, upvoteName,
      getVotedSet, ensureStatusDoc, getUid, getMySubmission
    } from "./app.js";

    // Fixed deadline shown on the poster: August 20, 5 PM India time.
    // Purely a visual countdown — actually closing submissions is a
    // separate manual action the admin takes, not automatic.
    const DEADLINE = new Date("2026-08-20T17:00:00+05:30");

    // -------------------------------------------------------------------
    // Translations — hand-written (not machine-translated on the fly) so
    // the English reads naturally. Add a key here + reference it via t()
    // anywhere new UI text is needed.
    // -------------------------------------------------------------------
    const STRINGS = {
      ml: {
        pageTitle: "ഓണം നെയിം ഹണ്ട്",
        kicker: "✦ ഒരു പുതിയ ആവേശം! ✦",
        titleLine1: "ഓണം",
        titleLine2: "നെയിം ഹണ്ട്",
        sub: "നിങ്ങളുടെ ഏറ്റവും മികച്ച പേര് നിർദ്ദേശിക്കൂ!",
        countdownLabel: "സമർപ്പിക്കാൻ ബാക്കിയുള്ള സമയം",
        countdownOver: "സമർപ്പിക്കാനുള്ള സമയം കഴിഞ്ഞു",
        cdDays: "ദിവസം", cdHours: "മണിക്കൂർ", cdMins: "മിനിറ്റ്", cdSecs: "സെക്കൻഡ്",
        bannerOpen: "സമർപ്പിക്കാൻ ഇപ്പോൾ സമയമുണ്ട്!",
        deadlineText: "ഓഗസ്റ്റ് 20 · വൈകുന്നേരം 5 മണിക്ക് മുമ്പ്",
        bannerClosed: "സമർപ്പിക്കൽ അവസാനിച്ചു.",
        winnerLabel: "🎉 വിജയിച്ച പേര് 🎉",
        methodRandom: "🎲 ക്രമരഹിതമായി തിരഞ്ഞെടുത്തത്",
        methodVotes: "🏆 ഏറ്റവും കൂടുതൽ വോട്ട് നേടിയത്",
        submitterPlaceholder: "നിങ്ങളുടെ പേര്...",
        namePlaceholder: "നിങ്ങളുടെ പേര് നിർദ്ദേശം...",
        submitBtn: "സമർപ്പിക്കൂ",
        listTitle: "നിർദ്ദേശിക്കപ്പെട്ട പേരുകൾ",
        emptyMsg: "ഇതുവരെ പേരുകളൊന്നും നിർദ്ദേശിച്ചിട്ടില്ല. ആദ്യത്തെയാളാകൂ!",
        footerNote: "ഓരോ ഉപകരണത്തിനും ഒരു പേരിന് ഒരു വോട്ട് മാത്രം.",
        msgAlreadyVoted: "ഈ പേര് നേരത്തെ നിർദ്ദേശിച്ചിട്ടുണ്ട് — നിങ്ങൾ ഇതിനകം വോട്ട് ചെയ്തു!",
        msgVoteAdded: "ഈ പേര് നേരത്തെ ഉണ്ടായിരുന്നു — നിങ്ങളുടെ വോട്ട് ചേർത്തു!",
        msgThanks: "നന്ദി! നിങ്ങളുടെ പേര് ചേർത്തു.",
        msgError: "എന്തോ കുഴപ്പം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കൂ.",
        msgAlreadySubmitted: "ഈ ഉപകരണത്തിൽ നിന്ന് നിങ്ങൾ ഇതിനകം ഒരു പേര് സമർപ്പിച്ചിട്ടുണ്ട്.",
        alreadySubmittedLabel: "നിങ്ങൾ സമർപ്പിച്ച പേര്",
        alreadySubmittedHint: "ഓരോ ഉപകരണത്തിനും ഒരു സമർപ്പണം മാത്രം — മറ്റൊരു പേര് നിർദ്ദേശിക്കാൻ വേറൊരു ഉപകരണം ഉപയോഗിക്കൂ.",
      },
      en: {
        pageTitle: "Onam Name Hunt",
        kicker: "✦ A New Wave of Excitement! ✦",
        titleLine1: "Onam",
        titleLine2: "Name Hunt",
        sub: "Suggest your best name idea!",
        countdownLabel: "Time left to submit",
        countdownOver: "Submission time is over",
        cdDays: "Days", cdHours: "Hours", cdMins: "Mins", cdSecs: "Secs",
        bannerOpen: "Submissions are open now!",
        deadlineText: "Before 5 PM, August 20",
        bannerClosed: "Submissions are closed.",
        winnerLabel: "🎉 Winning Name 🎉",
        methodRandom: "🎲 Chosen at random",
        methodVotes: "🏆 Most upvoted",
        submitterPlaceholder: "Your name...",
        namePlaceholder: "Suggest a name...",
        submitBtn: "Submit",
        listTitle: "Suggested Names",
        emptyMsg: "No names suggested yet. Be the first!",
        footerNote: "One vote per name, per device.",
        msgAlreadyVoted: "This name was already suggested — you've already voted for it!",
        msgVoteAdded: "This name already existed — your vote has been added!",
        msgThanks: "Thanks! Your name has been added.",
        msgError: "Something went wrong. Please try again.",
        msgAlreadySubmitted: "You've already submitted a name from this device.",
        alreadySubmittedLabel: "Your submitted name",
        alreadySubmittedHint: "Only one submission per device — use a different device to suggest another name.",
      },
    };

    let lang = localStorage.getItem("lang") || "ml";
    function t(key) { return STRINGS[lang][key]; }

    const langToggleEl = document.getElementById("langToggle");
    const namesListEl = document.getElementById("namesList");
    const listCardEl = document.getElementById("listCard");
    const statusBannerEl = document.getElementById("statusBanner");
    const countdownCardEl = document.getElementById("countdownCard");
    const winnerCardEl = document.getElementById("winnerCard");
    const alreadySubmittedCardEl = document.getElementById("alreadySubmittedCard");
    const formCardEl = document.getElementById("formCard");
    const formEl = document.getElementById("submitForm");
    const submitterInputEl = document.getElementById("submitterInput");
    const inputEl = document.getElementById("nameInput");
    const submitBtnEl = document.getElementById("submitBtn");
    const formMsgEl = document.getElementById("formMsg");

    let latestNames = [];
    let latestStatus = { isOpen: true, showNamesPublicly: false, winnerNameId: null, winnerMethod: null };
    let mySubmission = null; // set once we know whether this device already submitted

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function methodLabel(method) {
      if (method === "random") return t("methodRandom");
      if (method === "votes") return t("methodVotes");
      return "";
    }

    // ---------------- static text + language toggle ----------------
    function applyStaticText() {
      document.documentElement.lang = lang;
      document.title = t("pageTitle");
      document.getElementById("txtKicker").textContent = t("kicker");
      document.getElementById("txtTitle").innerHTML =
        `${escapeHtml(t("titleLine1"))}<br><span class="accent">${escapeHtml(t("titleLine2"))}</span>`;
      document.getElementById("txtSub").textContent = t("sub");
      submitterInputEl.placeholder = t("submitterPlaceholder");
      inputEl.placeholder = t("namePlaceholder");
      submitBtnEl.textContent = t("submitBtn");
      document.getElementById("txtListTitle").textContent = t("listTitle");
      document.getElementById("txtFooterNote").textContent = t("footerNote");

      langToggleEl.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
    }

    langToggleEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      lang = btn.dataset.lang;
      localStorage.setItem("lang", lang);
      applyStaticText();
      renderCountdown();
      renderStatus();
      renderNames();
    });

    // ---------------- countdown ----------------
    function renderCountdown() {
      const ms = DEADLINE.getTime() - Date.now();
      if (ms <= 0) {
        countdownCardEl.innerHTML = `
          <div class="card countdown-card">
            <div class="countdown-label">${t("countdownOver")}</div>
          </div>`;
        return;
      }
      const s = Math.floor(ms / 1000);
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      const pad = (n) => String(n).padStart(2, "0");
      countdownCardEl.innerHTML = `
        <div class="card countdown-card">
          <div class="countdown-label">${t("countdownLabel")}</div>
          <div class="countdown-clock">
            <div class="cd-unit"><span class="cd-num">${days}</span><span class="cd-label">${t("cdDays")}</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(hours)}</span><span class="cd-label">${t("cdHours")}</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(mins)}</span><span class="cd-label">${t("cdMins")}</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(secs)}</span><span class="cd-label">${t("cdSecs")}</span></div>
          </div>
        </div>`;
    }
    setInterval(renderCountdown, 1000);

    // ---------------- names list (admin-controlled visibility) ----------------
    async function renderNames() {
      if (!latestStatus.showNamesPublicly) {
        listCardEl.style.display = "none";
        return;
      }
      listCardEl.style.display = "";

      if (latestNames.length === 0) {
        namesListEl.innerHTML = `<p class="empty-msg">${t("emptyMsg")}</p>`;
        return;
      }
      const voted = await getVotedSet(latestNames.map((n) => n.id));
      namesListEl.innerHTML = latestNames.map((n, i) => {
        const isVoted = voted.has(n.id);
        return `
          <div class="name-row">
            <span class="rank">${i + 1}</span>
            <span class="text">${escapeHtml(n.text)}</span>
            <button class="vote-btn ${isVoted ? "voted" : ""}" data-id="${n.id}" ${!latestStatus.isOpen ? "disabled" : ""}>
              👍 <span>${n.votes || 0}</span>
            </button>
          </div>`;
      }).join("");
    }

    function renderAlreadySubmitted() {
      if (!mySubmission) {
        alreadySubmittedCardEl.innerHTML = "";
        return;
      }
      alreadySubmittedCardEl.innerHTML = `
        <div class="card submitted-card">
          <div class="label">${t("alreadySubmittedLabel")}</div>
          <div class="name">${escapeHtml(mySubmission.text)}</div>
          <div class="hint">${t("alreadySubmittedHint")}</div>
        </div>`;
    }

    function renderStatus() {
      const formShouldShow = latestStatus.isOpen && !mySubmission;

      if (latestStatus.isOpen) {
        statusBannerEl.innerHTML = `
          <div class="banner open">
            ${t("bannerOpen")}<br>
            <span class="deadline">${t("deadlineText")}</span>
          </div>`;
      } else {
        statusBannerEl.innerHTML = `<div class="banner closed">${t("bannerClosed")}</div>`;
      }
      formCardEl.style.display = formShouldShow ? "" : "none";
      renderAlreadySubmitted();

      if (latestStatus.winnerNameId) {
        const winner = latestNames.find((n) => n.id === latestStatus.winnerNameId);
        winnerCardEl.innerHTML = `
          <div class="card winner-card">
            <div class="label">${t("winnerLabel")}</div>
            <div class="name">${winner ? escapeHtml(winner.text) : "…"}</div>
            <div class="method">${methodLabel(latestStatus.winnerMethod)}</div>
          </div>`;
      } else {
        winnerCardEl.innerHTML = "";
      }
    }

    applyStaticText();
    renderCountdown();

    getMySubmission().then((submission) => {
      mySubmission = submission;
      renderStatus();
    }).catch((err) => console.error("getMySubmission failed", err));

    subscribeToNames((names) => {
      latestNames = names;
      renderNames();
      renderStatus();
    });

    subscribeToStatus((status) => {
      latestStatus = status;
      renderStatus();
      renderNames();
    });

    ensureStatusDoc().catch(() => { /* fine if it already exists */ });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value;
      const submitter = submitterInputEl.value;
      if (!text.trim() || !submitter.trim()) return;

      submitBtnEl.disabled = true;
      formMsgEl.textContent = "";
      formMsgEl.className = "form-msg";

      try {
        const result = await submitOrVoteName(text, submitter);
        mySubmission = { text: result.alreadyExisted ? latestNames.find((n) => n.id === result.nameId)?.text || text : text };
        inputEl.value = "";
        if (result.alreadyExisted) {
          formMsgEl.textContent = result.alreadyVoted ? t("msgAlreadyVoted") : t("msgVoteAdded");
        } else {
          formMsgEl.textContent = t("msgThanks");
        }
        formMsgEl.classList.add("ok");
        renderStatus();
      } catch (err) {
        console.error(err);
        formMsgEl.textContent = err.message === "ALREADY_SUBMITTED" ? t("msgAlreadySubmitted") : t("msgError");
        formMsgEl.classList.add("error");
      } finally {
        submitBtnEl.disabled = false;
      }
    });

    namesListEl.addEventListener("click", async (e) => {
      const btn = e.target.closest(".vote-btn");
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try {
        await upvoteName(btn.dataset.id);
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = !latestStatus.isOpen ? true : false;
      }
    });
  </script>
</body>
</html>
