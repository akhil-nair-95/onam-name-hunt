<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ഓണം നെയിം ഹണ്ട്</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <p class="kicker">✦ ഒരു പുതിയ ആവേശം! ✦</p>
      <h1>ഓണം<br><span class="accent">നെയിം ഹണ്ട്</span></h1>
      <p class="sub">നിങ്ങളുടെ ഏറ്റവും മികച്ച പേര് നിർദ്ദേശിക്കൂ!</p>
    </header>

    <div id="statusBanner"></div>
    <div id="countdownCard"></div>
    <div id="winnerCard"></div>

    <section class="card" id="formCard">
      <form class="submit-form" id="submitForm" autocomplete="off">
        <input type="text" id="submitterInput" placeholder="നിങ്ങളുടെ പേര്..." maxlength="60" required>
        <input type="text" id="nameInput" placeholder="നിങ്ങളുടെ പേര് നിർദ്ദേശം..." maxlength="60" required>
        <button type="submit" class="btn" id="submitBtn">സമർപ്പിക്കൂ</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </section>

    <section class="card" id="listCard">
      <h2 class="list-title">നിർദ്ദേശിക്കപ്പെട്ട പേരുകൾ</h2>
      <div id="namesList"></div>
    </section>

    <p class="footer-note">ഓരോ ഉപകരണത്തിനും ഒരു പേരിന് ഒരു വോട്ട് മാത്രം.</p>
  </div>

  <script type="module">
    import {
      subscribeToNames, subscribeToStatus, submitOrVoteName, upvoteName,
      getVotedSet, ensureStatusDoc, getUid
    } from "./app.js";

    // Fixed deadline shown on the poster: August 20, 5 PM India time.
    // Purely a visual countdown — actually closing submissions is a
    // separate manual action the admin takes, not automatic.
    const DEADLINE = new Date("2026-08-20T17:00:00+05:30");

    const namesListEl = document.getElementById("namesList");
    const listCardEl = document.getElementById("listCard");
    const statusBannerEl = document.getElementById("statusBanner");
    const countdownCardEl = document.getElementById("countdownCard");
    const winnerCardEl = document.getElementById("winnerCard");
    const formCardEl = document.getElementById("formCard");
    const formEl = document.getElementById("submitForm");
    const submitterInputEl = document.getElementById("submitterInput");
    const inputEl = document.getElementById("nameInput");
    const submitBtnEl = document.getElementById("submitBtn");
    const formMsgEl = document.getElementById("formMsg");

    let latestNames = [];
    let latestStatus = { isOpen: true, showNamesPublicly: false, winnerNameId: null, winnerMethod: null };

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function methodLabel(method) {
      if (method === "random") return "🎲 ക്രമരഹിതമായി തിരഞ്ഞെടുത്തത്";
      if (method === "votes") return "🏆 ഏറ്റവും കൂടുതൽ വോട്ട് നേടിയത്";
      return "";
    }

    // ---------------- countdown ----------------
    function renderCountdown() {
      const ms = DEADLINE.getTime() - Date.now();
      if (ms <= 0) {
        countdownCardEl.innerHTML = `
          <div class="card countdown-card">
            <div class="countdown-label">സമർപ്പിക്കാനുള്ള സമയം കഴിഞ്ഞു</div>
          </div>`;
        return;
      }
      const s = Math.floor(ms / 1000);
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      const pad = (n) => String(n).padStart(2, "0");
      countdownCardEl.innerHTML = `
        <div class="card countdown-card">
          <div class="countdown-label">സമർപ്പിക്കാൻ ബാക്കിയുള്ള സമയം</div>
          <div class="countdown-clock">
            <div class="cd-unit"><span class="cd-num">${days}</span><span class="cd-label">ദിവസം</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(hours)}</span><span class="cd-label">മണിക്കൂർ</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(mins)}</span><span class="cd-label">മിനിറ്റ്</span></div>
            <div class="cd-unit"><span class="cd-num">${pad(secs)}</span><span class="cd-label">സെക്കൻഡ്</span></div>
          </div>
        </div>`;
    }
    renderCountdown();
    setInterval(renderCountdown, 1000);

    // ---------------- names list (admin-controlled visibility) ----------------
    async function renderNames() {
      if (!latestStatus.showNamesPublicly) {
        listCardEl.style.display = "none";
        return;
      }
      listCardEl.style.display = "";

      if (latestNames.length === 0) {
        namesListEl.innerHTML = '<p class="empty-msg">ഇതുവരെ പേരുകളൊന്നും നിർദ്ദേശിച്ചിട്ടില്ല. ആദ്യത്തെയാളാകൂ!</p>';
        return;
      }
      const voted = await getVotedSet(latestNames.map((n) => n.id));
      namesListEl.innerHTML = latestNames.map((n, i) => {
        const isVoted = voted.has(n.id);
        return `
          <div class="name-row">
            <span class="rank">${i + 1}</span>
            <span class="text">${escapeHtml(n.text)}</span>
            <button class="vote-btn ${isVoted ? "voted" : ""}" data-id="${n.id}" ${!latestStatus.isOpen ? "disabled" : ""}>
              👍 <span>${n.votes || 0}</span>
            </button>
          </div>`;
      }).join("");
    }

    function renderStatus() {
      if (latestStatus.isOpen) {
        statusBannerEl.innerHTML = `
          <div class="banner open">
            സമർപ്പിക്കാൻ ഇപ്പോൾ സമയമുണ്ട്!<br>
            <span class="deadline">ഓഗസ്റ്റ് 20 · വൈകുന്നേരം 5 മണിക്ക് മുമ്പ്</span>
          </div>`;
        formCardEl.style.display = "";
      } else {
        statusBannerEl.innerHTML = `<div class="banner closed">സമർപ്പിക്കൽ അവസാനിച്ചു.</div>`;
        formCardEl.style.display = "none";
      }

      if (latestStatus.winnerNameId) {
        const winner = latestNames.find((n) => n.id === latestStatus.winnerNameId);
        winnerCardEl.innerHTML = `
          <div class="card winner-card">
            <div class="label">🎉 വിജയിച്ച പേര് 🎉</div>
            <div class="name">${winner ? escapeHtml(winner.text) : "…"}</div>
            <div class="method">${methodLabel(latestStatus.winnerMethod)}</div>
          </div>`;
      } else {
        winnerCardEl.innerHTML = "";
      }
    }

    subscribeToNames((names) => {
      latestNames = names;
      renderNames();
      renderStatus();
    });

    subscribeToStatus((status) => {
      latestStatus = status;
      renderStatus();
      renderNames();
    });

    ensureStatusDoc().catch(() => { /* fine if it already exists */ });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value;
      const submitter = submitterInputEl.value;
      if (!text.trim() || !submitter.trim()) return;

      submitBtnEl.disabled = true;
      formMsgEl.textContent = "";
      formMsgEl.className = "form-msg";

      try {
        const result = await submitOrVoteName(text, submitter);
        inputEl.value = "";
        if (result.alreadyExisted) {
          formMsgEl.textContent = result.alreadyVoted
            ? "ഈ പേര് നേരത്തെ നിർദ്ദേശിച്ചിട്ടുണ്ട് — നിങ്ങൾ ഇതിനകം വോട്ട് ചെയ്തു!"
            : "ഈ പേര് നേരത്തെ ഉണ്ടായിരുന്നു — നിങ്ങളുടെ വോട്ട് ചേർത്തു!";
        } else {
          formMsgEl.textContent = "നന്ദി! നിങ്ങളുടെ പേര് ചേർത്തു.";
        }
        formMsgEl.classList.add("ok");
      } catch (err) {
        console.error(err);
        formMsgEl.textContent = "എന്തോ കുഴപ്പം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കൂ.";
        formMsgEl.classList.add("error");
      } finally {
        submitBtnEl.disabled = false;
      }
    });

    namesListEl.addEventListener("click", async (e) => {
      const btn = e.target.closest(".vote-btn");
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try {
        await upvoteName(btn.dataset.id);
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = !latestStatus.isOpen ? true : false;
      }
    });
  </script>
</body>
</html>
